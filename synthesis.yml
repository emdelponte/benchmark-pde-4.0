# Curated cross-model synthesis. "covers" lists the runs this text was written for;
# the report warns automatically when a newer run exists that is not covered here.
written: 2026-11-22
covers:
  - claude-opus-5-5-10-october-2026
  - gpt-6-1-sol-medium-10-october-2026
  - gemini-flash-3-8-high-10-october-2026
  - gemini-carbon-medium-22-november-2026
bottom_line: >-
  Four agents, one verdict. With weather known by anthesis, a parsimonious
  logistic model ranks FHB epidemic risk only weakly when whole seasons are
  held out (AUC 0.62 to 0.67). Adding cultivar resistance lifts it to about
  0.70 to 0.72. Where they really differ is in scientific conduct, not in
  their numbers.
points:
  - title: "One answer, four routes"
    text: >-
      Each agent picked a different moisture variable: mean RH (Claude),
      low-VPD hours ending 5 days early (GPT), 12-h "overnight" RH (Gemini
      Flash) and 10-day VPD plus earlier warmth (Gemini Carbon). Yet the
      year-out AUCs land within 0.06 of each other, and their CIs overlap
      heavily. The signal looks real but small, and it is not tied to any
      particular variable.
  - title: "The gap to the literature is the headline"
    text: >-
      The published models in this dataset lineage report AUCs of 0.80 to 0.90,
      but they use bigger candidate sets, host and post-anthesis terms, and
      random or stratified CV. All four agents land roughly 0.13 to 0.28 lower under
      season-grouped validation. Claude puts the clustering effect at about
      0.03 for its model, while Gemini Carbon shows random CV inflating
      flexible models by 0.04 to 0.21. Comparing the published models under
      one year-out protocol is the obvious follow-up.
  - title: "Behaviour is what separates them"
    text: >-
      GPT was the only one to stop at the undocumented binary outcome and at
      day-0 windows that are not available at a 00 UTC issue time. Claude ran
      broad, honest validations and reported missing its own usefulness bar.
      Gemini Carbon ran the most complete validation (year, state and
      state-year folds, plus a leakage test) and found the UTC "overnight"
      artifact, but its final model was trimmed after seeing the data. Gemini
      Flash reported clearly and found the spring-wheat failure, but its claims
      outrun its evidence. Both Gemini runs still write "proof".
  - title: "Temperature: the earlier window wins"
    text: >-
      Mean temperature in the last week or two before anthesis is null for
      Claude and Gemini Carbon. An earlier window (days −20 to −10) is
      positive for Claude, GPT and Gemini Carbon, which makes it the best
      supported weather lead after moisture. Both Gemini runs also find that
      spring wheat in the Northern Plains is where weather-only models fail.
caveat: >-
  The conduct scores and this synthesis were written by Claude, which belongs
  to the same model family as one of the contestants. Treat them as a starting
  point and edit the YAML files to override any score.
