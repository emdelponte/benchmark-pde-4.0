# FHBVer2 data dictionary
glossary:
  - term: "No."
    meaning: "Number of / count of"
  - term: "d"
    meaning: "day(s) — SI symbol for day, used as a count unit (e.g. '20 d' = 20 days)"
  - term: "hr"
    meaning: "hour(s)"
  - term: "T"
    meaning: "Air temperature"
  - term: "D"
    meaning: "Dewpoint temperature"
  - term: "P"
    meaning: "Barometric pressure"
  - term: "RH"
    meaning: "Relative humidity"
  - term: "VPD"
    meaning: "Vapor pressure deficit"
  - term: "TRH"
    meaning: "Combined temperature-and-relative-humidity condition"
  - term: "TDD"
    meaning: "Temperature-dewpoint depression"
  - term: "SD"
    meaning: "Standard deviation"
  - term: "CD"
    meaning: "Count of days (used in variable name suffixes)"
  - term: "CHD"
    meaning: "Count of hours over a full 24-hour day (used in variable name suffixes)"
  - term: "24H / 12H"
    meaning: "Indicates whether the daily window is calculated over a full 24-hour day or a 12-hour overnight period (20:00 to 08:00 the next day in FHBVer2)"
  - term: "DD"
    meaning: "Dewpoint depression (= TDD); legacy stem, used only for overnight (12H) variables in FHBVer2"
  - term: "A"
    meaning: "Average (mean) over the window (variable-name token)"
  - term: "MINMAXDIFF"
    meaning: "Daily maximum minus daily minimum, averaged over the window (variable-name token)"
  - term: "G / L"
    meaning: "Greater / less than a threshold (variable-name token); the exact operator (> vs >=, < vs <=) is given in the condition field"
  - term: "nRH"
    meaning: "'and RH' in combined temperature-and-RH threshold names, e.g. 15T30nRHG80"
  - term: "PREn / POSTn"
    meaning: "Window from n d pre-anthesis to anthesis / from anthesis to n d post-anthesis"
  - term: "MT"
    meaning: "Legacy name prefix: mean daily minimum air temperature"

conventions:
  - id: notation
    applies_to: [applies_to]
    rule: "Dot notation (e.g. valid_range.max) in this section's applies_to field refers to a nested key — the field
           after the dot is a child key inside the field before the dot, matching the nested structure used in the
           variable entries below."

  - id: window_day_bounds
    applies_to: [window_start_day, window_end_day, valid_range.max]
    rule: "window_start_day and window_end_day are integer offsets in days relative to anthesis (day 0). 
           Windows are CLOSED intervals [window_start_day, window_end_day]: both end days are included, so n_days =
           window_end_day - window_start_day + 1. Theoretical max for daily-step counts = n_days; for hourly 24H
           counts = 24 x n_days."

  - id: overnight_fixed_hours
    applies_to: [valid_range.max, condition]
    rule: "The 'overnight' (12H variables) is the fixed period 20:00 to 08:00 the next day (12 h per night),
           NOT sunset-to-sunrise. valid_range.max = 12 x n_days (see window_day_bounds) is therefore a
           fixed theoretical bound."

  - id: same_condition_as
    applies_to: [same_condition_as]
    rule: "Variables applying an identical condition (same variable(s), thresholds, operators, 24H vs overnight
           scope and time step) over different windows. Derived programmatically; lists follow parquet column order
           and exclude the variable itself, its identical_to partner and deprecated aliases. Compare
           window_start_day/window_end_day to determine nesting/overlap."

  - id: same_window_as
    applies_to: [same_window_as, window_start_day, window_end_day]
    rule: "Weather-derived variables with identical window_start_day and window_end_day, i.e. summarising conditions
           over the same closed day window, regardless of condition, statistic or 24H/overnight scope (12H and 24H
           variables with the same day window still cover different hours; see overnight_fixed_hours). Derived
           programmatically; lists follow parquet column order and exclude the variable itself, its identical_to
           partner and deprecated aliases. [] means no other variable shares the window."

  - id: identical_to
    applies_to: [identical_to, canonical, deprecated]
    rule: "Two differently-named variables are numerically identical by construction (verified: exactly equal in all
           rows). The standardised name is canonical: true; the legacy name is canonical: false and
           deprecated: true. Legacy names are retained for backward compatibility with published papers and older
           scripts/pipelines; do not use deprecated names in new analyses."

tables:
- name: FHBVer2
  description: FHB plot-level data matrix with weather predictors
  source:
    formats: [parquet, csv, rds]
  geographic_scope:
  - id: conterminous_us_only
    description: All plots in this dataset are located within the conterminous United States
    notes:
      - "Excludes Alaska and Hawaii"
    variables_involved: [state]
  columns:
  - name: id
    description: Unique ID for each row in the data matrix
    type: integer
    category: metadata
    missing_pct: 0.0
    range:
      min: 1
      max: 999
  - name: year
    description: Year in which plot was assessed for FHB
    type: integer
    category: calendar_reference
    missing_pct: 0.0
    range:
      min: 1982
      max: 2015
  - name: state
    description: US state in which the plot was located
    type: factor
    category: spatial_reference
    missing_pct: 0.0
    levels:
    - AR
    - DE
    - IL
    - IN
    - KS
    - KY
    - MD
    - MI
    - MN
    - MO
    - ND
    - NE
    - NY
    - OH
    - PA
    - SD
    - WI
    geographic_scope_ref: conterminous_us_only
  - name: fdate
    description: Anthesis date as a date-time variable in UTC
    type: POSIXct
    category: temporal_reference
    missing_pct: 0.0
    range:
      min: "1982-05-26 00:00:00 UTC"
      max: "2015-07-14 00:00:00 UTC"
  - name: type
    description: Spring wheat or winter wheat
    type: factor
    category: agronomic
    missing_pct: 0.0
    levels:
    - spring
    - winter
  - name: resist
    description: >-
      Ordinal variable categorizing resistance of the cultivar to FHB; VS = very
      susceptible, S = susceptible, MS = moderately susceptible, MR = moderately
      resistant
    type: factor
    category: agronomic
    missing_pct: 0.0
    levels:
    - VS
    - S
    - MS
    - MR
  - name: corn
    description: Presence of some level of corn residue in the plot (1), or absence of any corn residue (0)
    type: integer
    category: agronomic
    missing_pct: 0.4
    range:
      min: 0
      max: 1
    value_labels:
      "0": Absence of any corn residue
      "1": Presence of some level of corn residue in the plot
  - name: S
    description: FHB index, or severity of FHB symptoms on the spike
    unit: percent
    type: numeric
    category: response
    missing_pct: 0.0
    range:
      min: 0.0
      max: 86.18
    valid_range:
      min: 0.0
      max: 100.0
  - name: T.A.1
    description: Mean daily T (degC), 25 d to 15 d pre-anthesis
